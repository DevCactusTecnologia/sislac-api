; SISLAC — configurações PHP em cima da imagem oficial php:8.4-fpm-alpine.
; Ambiente: dev por padrão. Em produção o `.env` do host define APP_ENV=production
; e o entrypoint substitui as diretivas comentadas abaixo por versões mais duras.

; --- Erros e display ---------------------------------------------------------
display_errors = On
display_startup_errors = On
log_errors = On
error_log = /var/log/php-fpm.log

; --- Limites -----------------------------------------------------------------
memory_limit = 512M
post_max_size = 30M
upload_max_filesize = 25M
max_execution_time = 120

; --- Timezone / localização --------------------------------------------------
date.timezone = America/Sao_Paulo
intl.default_locale = pt_BR

; --- OPcache -----------------------------------------------------------------
opcache.enable = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.revalidate_freq = 0
opcache.validate_timestamps = 1
opcache.enable_cli = 1

; --- Segurança ---------------------------------------------------------------
expose_php = Off
allow_url_fopen = Off
allow_url_include = Off

; Em produção, ajuste no host:
;   display_errors = Off
;   display_startup_errors = Off
;   opcache.validate_timestamps = 0
