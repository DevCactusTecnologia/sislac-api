# SISLAC — API · docker compose (dev opcional + produção na VPS)
#
# Todos os serviços expõem porta APENAS em 127.0.0.1. Acesso externo é feito
# por túnel SSH (admin) ou pelo Nginx público com TLS (produção) — ver
# docs/DEPLOY.md, docs/PGADMIN.md e docs/CONECTAR_DBEAVER.md.
#
# No PC (Herd), normalmente só o banco é necessário:
#   docker compose up -d postgres redis pgadmin
# Na VPS sobe tudo:
#   docker compose up -d

name: sislac-api

x-app-image: &app-image
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    args:
      WWWUSER: "${WWWUSER:-1000}"
      WWWGROUP: "${WWWGROUP:-1000}"
  image: sislac/api:local
  env_file: .env
  # Dentro da rede do compose os hosts são os nomes dos serviços. Estas linhas
  # sobrescrevem o que o .env traz (127.0.0.1, usado pelo Herd no PC).
  environment:
    PHP_MEMORY_LIMIT: 512M
    DB_HOST: postgres
    TENANT_DB_HOST: postgres
    REDIS_HOST: redis
  volumes:
    - .:/var/www/html
    - vendor:/var/www/html/vendor
  networks:
    - sislac
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  app:
    <<: *app-image
    container_name: sislac-app
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: sislac-nginx
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - sislac
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: sislac-postgres
    environment:
      POSTGRES_USER: ${DB_ROOT_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_ROOT_PASSWORD:-postgres}
      POSTGRES_DB: postgres
      # Repassa a senha do papel de aplicação para o script de init.
      SISLAC_APP_PASSWORD: ${DB_PASSWORD:-change-me-in-env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_ROOT_USER:-postgres} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    networks:
      - sislac
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: sislac-redis
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-redis}
      - --appendonly
      - "yes"
      - --maxmemory
      - "512mb"
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD:-redis} ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - sislac
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: sislac-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@sislac.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_LOGIN_BANNER: '"SISLAC — Ambiente ${APP_ENV:-local}"'
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sislac
    restart: unless-stopped

  # Ativados nas fases 1 e 2 (mesma imagem, só muda o comando de arranque):
  #
  # horizon:
  #   <<: *app-image
  #   container_name: sislac-horizon
  #   command: php artisan horizon
  #
  # scheduler:
  #   <<: *app-image
  #   container_name: sislac-scheduler
  #   command: php artisan schedule:work
  #
  # reverb:
  #   <<: *app-image
  #   container_name: sislac-reverb
  #   command: php artisan reverb:start --host=0.0.0.0 --port=8080
  #   ports:
  #     - "127.0.0.1:8081:8080"

networks:
  sislac:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
  vendor:
