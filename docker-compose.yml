# SISLAC — API · docker compose (dev opcional + produção na VPS)
#
# Todos os serviços expõem porta APENAS em 127.0.0.1. Acesso externo é feito
# por túnel SSH (admin) ou pelo Nginx público com TLS (produção).
#
# No PC (Herd), normalmente só o banco é necessário:
#   docker compose up -d postgres pgadmin
# Na VPS sobe app, nginx e postgres; pgAdmin é opcional.

name: sislac-api

x-app-image: &app-image
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    args:
      WWWUSER: "${WWWUSER:-1000}"
      WWWGROUP: "${WWWGROUP:-1000}"
  image: sislac/api:local
  env_file: .env
  environment:
    PHP_MEMORY_LIMIT: 512M
    DB_HOST: postgres
    TENANT_DB_HOST: postgres
  volumes:
    - .:/var/www/html
    - vendor:/var/www/html/vendor
  networks:
    - sislac
  depends_on:
    postgres:
      condition: service_healthy

services:
  app:
    <<: *app-image
    container_name: sislac-app
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: sislac-nginx
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - sislac
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: sislac-postgres
    environment:
      POSTGRES_USER: ${DB_ROOT_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_ROOT_PASSWORD:-postgres}
      POSTGRES_DB: postgres
      SISLAC_APP_PASSWORD: ${DB_PASSWORD:-change-me-in-env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_ROOT_USER:-postgres} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    networks:
      - sislac
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: sislac-pgadmin
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@sislac.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_LOGIN_BANNER: '"SISLAC — Ambiente ${APP_ENV:-local}"'
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sislac
    restart: unless-stopped

networks:
  sislac:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data:
  vendor:
