name: CI

on:
  push:
    branches: [main, fase-*, refactor/supabase-backend-simplification]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Qualidade PHP
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sislac_test
          POSTGRES_PASSWORD: sislac_test
          POSTGRES_DB: sislac_test
        options: >-
          --health-cmd="pg_isready -U sislac_test -d sislac_test"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
        ports:
          - 5432:5432

    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: sislac_test
      DB_USERNAME: sislac_test
      DB_PASSWORD: sislac_test
      DB_SSLMODE: disable

    steps:
      - uses: actions/checkout@v4

      - name: PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql, intl, bcmath, gd, zip, mbstring, opcache, pcntl
          coverage: none
          tools: composer:v2

      - name: Composer Validate — manifesto e lock
        run: composer validate --strict --no-interaction

      - name: Diretório de cache do Composer
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache do Composer
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Dependências
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Composer Audit — dependências conhecidas como vulneráveis
        run: composer audit --locked --no-interaction

      - name: Ambiente
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Cliente PostgreSQL
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Fixture PostgreSQL compatível com Supabase
        env:
          PGPASSWORD: sislac_test
        run: psql -h 127.0.0.1 -U sislac_test -d sislac_test -v ON_ERROR_STOP=1 -f tests/Fixtures/supabase-test-schema.sql

      - name: Pint — formatação
        run: vendor/bin/pint --test

      - name: Larastan — análise estática nível 8
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Pest — testes
        run: |
          set -o pipefail
          vendor/bin/pest --parallel --colors=never 2>&1 | tee pest-output.txt

      - name: Diagnóstico Pest
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pest-diagnostic
          path: pest-output.txt
          retention-days: 1

  guards:
    name: Guards de repositório
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: ripgrep
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep

      - name: Escopo do backend
        run: |
          set -o pipefail
          bash scripts/check-backend-scope.sh 2>&1 | tee backend-scope-output.txt

      - name: Diagnóstico do escopo
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-scope-diagnostic
          path: backend-scope-output.txt
          retention-days: 1

      - name: Contrato PostgreSQL-only
        run: bash scripts/check-database-contract.sh

      - name: Nenhum arquivo acima de 500 KiB
        run: bash scripts/check-file-size.sh

      - name: Nenhum .env comitado
        run: |
          if git ls-files | grep -E '(^|/)\.env(\.|$)' | grep -v '\.env\.example$'; then
            echo "::error::Arquivo .env comitado. Só o .env.example pode ir para o repositório."
            exit 1
          fi
          echo "OK — nenhum .env no repositório."
