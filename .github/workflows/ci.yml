name: CI

on:
  push:
    branches: [main, fase-*]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Qualidade PHP
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sislac_app
          POSTGRES_PASSWORD: sislac_ci
          POSTGRES_DB: sislac_central
        options: >-
          --health-cmd="pg_isready -U sislac_app -d sislac_central"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
        ports:
          - 5432:5432

    env:
      APP_ENV: testing
      DB_CONNECTION: central
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: sislac_central
      DB_USERNAME: sislac_app
      DB_PASSWORD: sislac_ci
      TENANT_DB_HOST: 127.0.0.1
      TENANT_DB_PORT: 5432
      TENANT_DB_USERNAME: sislac_app
      TENANT_DB_PASSWORD: sislac_ci

    steps:
      - uses: actions/checkout@v4

      - name: PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql, intl, bcmath, gd, zip, mbstring, opcache, pcntl
          coverage: none
          tools: composer:v2

      - name: Composer Validate — manifesto e lock
        run: composer validate --strict --no-interaction

      - name: Diretório de cache do Composer
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache do Composer
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Dependências
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Composer Audit — dependências conhecidas como vulneráveis
        run: composer audit --locked --no-interaction

      - name: Ambiente
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Integridade do manifesto Supabase
        run: php scripts/check-supabase-contract.php

      - name: Pint — diagnóstico de formatação
        run: |
          vendor/bin/pint x.php database/migrations/tenant/2026_09_09_000500_add_financeiro_core.php
          git diff -- x.php database/migrations/tenant/2026_09_09_000500_add_financeiro_core.php
          exit 1

  guards:
    name: Guards de repositório
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: ripgrep
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
      - name: Fronteira Platform ↔ Domain
        run: bash scripts/check-no-central-in-tenant.sh
      - name: Escopo do backend
        run: bash scripts/check-backend-scope.sh
      - name: Bootstrap PostgreSQL do compose
        run: bash scripts/check-postgres-bootstrap.sh
      - name: Contrato PostgreSQL-only
        run: bash scripts/check-database-contract.sh
      - name: Nenhum arquivo acima de 500 KiB
        run: bash scripts/check-file-size.sh
      - name: Nenhum .env comitado
        run: |
          if git ls-files | grep -E '(^|/)\.env(\.|$)' | grep -v '\.env\.example$'; then
            echo "::error::Arquivo .env comitado. Só o .env.example pode ir para o repositório."
            exit 1
          fi
          echo "OK — nenhum .env no repositório."
