name: Resolve Composer dependencies

on:
  push:
    branches:
      - feat/fase-1-conformidade-laravel-supabase

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql, redis, intl, bcmath, gd, zip, mbstring, opcache, pcntl
          coverage: none
          tools: composer:v2

      - name: Resolver e validar dependências oficiais
        run: |
          composer require laravel/sanctum stancl/tenancy --no-interaction --no-progress --prefer-dist
          composer require --dev laravel/boost larastan/larastan --no-interaction --no-progress --prefer-dist
          composer validate --strict
          composer audit --locked --no-interaction

      - name: Versionar resultado exato e remover este resolvedor
        run: |
          rm .github/workflows/resolve-composer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.json composer.lock .github/workflows/resolve-composer.yml
          git diff --cached --check
          git commit -m "chore: instala dependências oficiais da fase 1"
          git push origin "HEAD:${GITHUB_REF_NAME}"
